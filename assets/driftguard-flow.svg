<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="360" viewBox="0 0 1080 360" role="img" aria-labelledby="title desc">
  <title id="title">DriftGuard traffic to CI flow</title>
  <desc id="desc">Frontend traffic goes through DriftGuard proxy to backend, schemas are pinned and CI checks drift.</desc>
  <style>
    :root {
      --bg: #ffffff;
      --text: #0f172a;
      --muted: #475569;
      --line: #334155;
      --card: #f8fafc;
      --accent: #2563eb;
      --accent-2: #0f766e;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b1220;
        --text: #e2e8f0;
        --muted: #94a3b8;
        --line: #64748b;
        --card: #111a2d;
        --accent: #60a5fa;
        --accent-2: #5eead4;
      }
    }
    .bg { fill: var(--bg); }
    .card { fill: var(--card); stroke: var(--line); stroke-width: 2; rx: 12; }
    .line { stroke: var(--line); stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    .title { fill: var(--text); font: 700 22px system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    .label { fill: var(--text); font: 600 16px system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    .small { fill: var(--muted); font: 500 13px system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    .accent { fill: var(--accent); }
    .accent2 { fill: var(--accent-2); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--line)" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1080" height="360" />
  <text class="title" x="40" y="46">DriftGuard: traffic -&gt; pin -&gt; diff -&gt; CI enforcement</text>

  <rect class="card" x="40" y="90" width="180" height="120" />
  <text class="label" x="66" y="135">Frontend / Tests</text>
  <text class="small" x="66" y="160">Vite, Next, Playwright</text>

  <rect class="card" x="300" y="70" width="300" height="180" />
  <text class="label" x="330" y="112">DriftGuard Proxy</text>
  <text class="small" x="330" y="138">1) Forward request</text>
  <text class="small" x="330" y="160">2) Infer JSON schema</text>
  <text class="small" x="330" y="182">3) Compare with pinned schema</text>
  <text class="small" x="330" y="204">4) Log violations + headers</text>

  <rect class="card" x="680" y="90" width="160" height="120" />
  <text class="label" x="722" y="135">Backend API</text>
  <text class="small" x="710" y="160">Any language</text>

  <rect class="card" x="300" y="270" width="220" height="70" />
  <text class="label" x="330" y="305">.driftguard/schemas</text>
  <text class="small" x="330" y="326">Pinned contract artifact</text>

  <rect class="card" x="600" y="270" width="260" height="70" />
  <text class="label" x="630" y="305">CI contract:report</text>
  <text class="small" x="630" y="326">Fails on BREAKING drift</text>

  <path class="line" d="M 220 150 L 300 150" />
  <path class="line" d="M 600 150 L 680 150" />
  <path class="line" d="M 450 250 L 410 270" />
  <path class="line" d="M 520 305 L 600 305" />

  <circle class="accent" cx="250" cy="150" r="4" />
  <circle class="accent2" cx="640" cy="150" r="4" />
</svg>
